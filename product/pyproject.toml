[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aisos-product"
version = "0.1.0"
description = "AI-SOS product runtime (MVP) — real FastAPI + Anthropic + SQLite. Isolated from src/aisos (reference spec)."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "anthropic>=0.40",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",       # client HTTP de l'UI Streamlit vers l'API (aussi utilisé par TestClient)
    "streamlit>=1.33",   # interface CEO minimale (Phase 2)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
    "mypy>=1.10",
]

# Le produit expose deux packages top-level (app = backend, ui = interface). On les déclare
# explicitement : l'auto-découverte setuptools refuse un flat-layout à plusieurs packages.
[tool.setuptools]
packages = ["app", "ui"]

# ---------------------------------------------------------------------------
# Outillage SCOPÉ au dossier product/ (indépendant de la racine).
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "ui", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "RUF"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["app", "ui", "tests"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
